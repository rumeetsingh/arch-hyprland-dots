[mgr]
linemode = "size"

[opener]
edit = [
    # Option 1: Open Micro in a new Kitty window
    { run = 'kitty micro %s', desc = "Micro (new Kitty window)", for = "unix" },

    # VS Code without blocking Yazi
    { run = 'code %s', desc = "VS Code" }
]
loupe = [
    { run = 'loupe %s', orphan = true, desc = "Loupe" }
]
chrome = [
    { run = 'google-chrome-stable %s', orphan = true, desc = "Google Chrome" }
]

[open]
prepend_rules = [
    # SVG: Enter opens Loupe, 'O' lets you pick edit
    { url = "*.svg", use = [ "loupe", "edit" ] },

    # HTML: Enter opens the editor, 'O' lets you pick Chrome (or vice versa)
    { url = "*.html", use = [ "edit", "chrome" ] },

    # Default rules to edit text and JSON
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
]
